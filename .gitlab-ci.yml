# CI for GitLab (remote "origin", code.andrena.de). GitHub runs .github/workflows/ci.yml instead.
# The jobs only prepare the environment; the work is done by the shared scripts in scripts/.
#
#   commit-messages
#   backend-build  ──► backend-test
#   frontend-build ──► frontend-test

workflow:
  rules:
    # Merge request open → MR pipeline only; otherwise a branch pipeline. Avoids duplicate pipelines.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  # Instance runner to use. Change or remove if jobs stay "pending" (ask the IT team which tag fits).
  tags: [not-ao-code-runner0]
  interruptible: true
  timeout: 15 minutes

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget/packages
  npm_config_cache: $CI_PROJECT_DIR/.npm

commit-messages:
  image: alpine:3.20
  needs: []
  variables:
    GIT_DEPTH: 0          # full history, so the pushed commit range can be read
  before_script:
    - apk add --no-cache git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - |
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        range="$CI_MERGE_REQUEST_DIFF_BASE_SHA..$CI_COMMIT_SHA"
      elif [ "$CI_COMMIT_BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
        range="$CI_COMMIT_SHA~1..$CI_COMMIT_SHA"   # first push of a branch: check the pushed tip
      else
        range="$CI_COMMIT_BEFORE_SHA..$CI_COMMIT_SHA"
      fi
      sh scripts/check-commit-msg.sh --range "$range"

backend-build:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  needs: []
  cache:
    key:
      files: [Directory.Packages.props]
    paths: [.nuget/packages]
  script:
    - sh scripts/ci/backend-build.sh
  artifacts:
    expire_in: 1 day
    paths:
      - FlatMonitor.Tests/bin/Release/net10.0/
    exclude:
      # Playwright's browser driver (~80 MB) is only used by the scraper, not by the tests.
      - FlatMonitor.Tests/bin/Release/net10.0/.playwright/**/*

backend-test:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  needs: [backend-build]
  script:
    - sh scripts/ci/backend-test.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths: [test-results/]
    reports:
      junit: test-results/backend-junit.xml

frontend-build:
  image: node:20-bookworm
  needs: []
  cache:
    key:
      files: [ClientApp/package-lock.json]
    paths: [.npm]
  script:
    - sh scripts/ci/frontend-build.sh
  artifacts:
    expire_in: 1 week
    paths: [ClientApp/dist/]

frontend-test:
  image: node:20-bookworm
  needs:
    - job: frontend-build
      artifacts: false    # ng test compiles on its own; it only waits for a green build
  variables:
    CHROME_BIN: /usr/bin/chromium
  cache:
    key:
      files: [ClientApp/package-lock.json]
    paths: [.npm]
    policy: pull          # frontend-build fills the cache
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends chromium
  script:
    - sh scripts/ci/frontend-test.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths: [ClientApp/test-results/]
    reports:
      junit: ClientApp/test-results/junit.xml
