<div class="container-fluid py-4">
  <div class="row mb-4">
    <div class="col">
      <h1 class="display-4">FlatMonitor</h1>
    </div>
  </div>

  <!-- Tab Navigation -->
  <div class="row mb-0">
    <div class="col">
      <ul class="nav nav-tabs" id="mainTabs">
        <li class="nav-item">
          <a class="nav-link active" id="dashboard-tab" data-bs-toggle="tab" href="#dashboardPane" role="tab">Dashboard</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" id="offers-tab" data-bs-toggle="tab" href="#offersPane" role="tab">Current Offers</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" id="history-tab" data-bs-toggle="tab" href="#historyPane" role="tab">History</a>
        </li>
      </ul>
    </div>
  </div>

  <!-- Tab Content -->
  <div class="tab-content" id="mainTabsContent">
    <div class="tab-pane fade show active pt-4" id="dashboardPane" role="tabpanel" aria-labelledby="dashboard-tab">
      <app-overview-tab></app-overview-tab>
    </div>

    <!-- Current Offers Tab -->
    <div class="tab-pane fade pt-4" id="offersPane" role="tabpanel" aria-labelledby="offers-tab">
      <app-offers-tab></app-offers-tab>
    </div>

    <!-- History Tab -->
    <div class="tab-pane fade pt-4" id="historyPane" role="tabpanel" aria-labelledby="history-tab">
      <app-history-tab></app-history-tab>
    </div>
  </div>
</div>
