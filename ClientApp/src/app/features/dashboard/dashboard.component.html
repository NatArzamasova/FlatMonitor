<app-header>
  <nav headerNav aria-label="Dashboard tabs">
    <ul class="navbar-nav nav-underline">
      <li class="nav-item">
        <a class="nav-link" routerLink="/overview" routerLinkActive="active" ariaCurrentWhenActive="page">Dashboard</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/offers" routerLinkActive="active" ariaCurrentWhenActive="page">Current Offers</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/history" routerLinkActive="active" ariaCurrentWhenActive="page">History</a>
      </li>
    </ul>
  </nav>
  <app-scrape-control headerActions></app-scrape-control>
  <button headerActions type="button" class="btn btn-sm btn-outline-secondary" (click)="reloadData()"
    title="Reload the data of this tab" aria-label="Reload data">↻</button>
  <!-- A link, not a button, so ctrl/middle click and "copy link" work too. -->
  <a headerActions class="btn btn-sm btn-outline-secondary" routerLink="/presets" target="_blank" rel="noopener"
    title="Manage filter presets in a new browser tab">⚙ Configure filters</a>
</app-header>

<main class="container-fluid py-4 fill-column">
  <router-outlet></router-outlet>
</main>
