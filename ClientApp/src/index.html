<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FlatMonitor</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- Sets the theme before the styles and Angular load, so a dark page does not flash white. Same key and rules as ThemeService. -->
  <script>
    (function () {
      var mode = 'system';
      try { mode = localStorage.getItem('flatmonitor.theme') || 'system'; } catch (e) {}
      var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
